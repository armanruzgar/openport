name: Release archives and Linux packages

# Attaches Linux archives and deb/rpm packages to a published release, built from
# the release's tag on native runners the way tools/release.sh builds its own, and
# the macOS archive when the release has none, then rewrites SHA256SUMS over every
# archive and package the release carries.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Build the image
        run: docker build --build-arg OPENPORT_BUILD_REVISION="$(git rev-parse HEAD)" -t openport:release .
      # CI builds and tests only amd64 Linux and arm64 macOS, so on each architecture the
      # image must start, answer the API contract and fill a paper order, as CI's Docker
      # job checks on amd64, before anything built from it is attached.
      - name: Smoke test the image on this architecture
        run: |
          docker run -d --rm --name openport -p 127.0.0.1:8080:8080 openport:release
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/status > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/status > /dev/null
          test "$(curl -s --path-as-is -o /dev/null -w '%{http_code}' http://127.0.0.1:8080//etc/passwd)" = 400
          token="$(docker exec openport cat /var/lib/openport/write-token)"
          python3 tools/smoke_trade.py http://127.0.0.1:8080 "$token"
          # The contract check needs jsonschema and pyyaml, which the system Python keeps out.
          python3 -m venv "$RUNNER_TEMP/venv" || {
            sudo apt-get update && sudo apt-get install -y python3-venv && python3 -m venv --clear "$RUNNER_TEMP/venv"; }
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema pyyaml
          "$RUNNER_TEMP/venv/bin/python" tools/contract_test.py http://127.0.0.1:8080 --token "$token" --spec docs/openapi.yaml
      - name: Stop the smoke server
        if: always()
        run: docker stop openport || true
      - name: Package the archive
        run: |
          name="openport-${TAG#v}-linux-${{ matrix.arch }}"
          stage="$RUNNER_TEMP/stage/$name"
          mkdir -p "$stage/bin" "$stage/share/openport" "$stage/docs"
          container="$(docker create openport:release)"
          docker cp "$container:/usr/local/bin/openportd" "$stage/bin/"
          docker cp "$container:/usr/local/bin/openport-probe" "$stage/bin/"
          docker cp "$container:/usr/share/openport/web" "$stage/share/openport/"
          docker rm "$container"
          cp README.md LICENSE "$stage/"
          # Releases from before the notices were added have none to copy.
          [ ! -f THIRD_PARTY_NOTICES.txt ] || cp THIRD_PARTY_NOTICES.txt "$stage/"
          cp docs/*.md "$stage/docs/"
          tar -C "$RUNNER_TEMP/stage" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
          echo "ARCHIVE=$RUNNER_TEMP/$name.tar.gz" >> "$GITHUB_ENV"
          echo "STAGE=$stage" >> "$GITHUB_ENV"
      # Upload the archive first, so a packaging failure still leaves it on the release.
      - name: Attach the archive to the release
        run: gh release upload "$TAG" "$ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Package deb and rpm with a systemd unit
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          cmake -S packaging -B "$RUNNER_TEMP/packages" \
            -DOPENPORT_STAGE="$STAGE" -DOPENPORT_PACKAGE_VERSION="${TAG#v}" \
            -DOPENPORT_PACKAGE_ARCH="${{ matrix.arch }}"
          cpack --config "$RUNNER_TEMP/packages/CPackConfig.cmake" -B "$RUNNER_TEMP/packages"
          python3 tools/package_test.py "$RUNNER_TEMP/packages" --arch "${{ matrix.arch }}"
      - name: Attach the packages to the release
        run: gh release upload "$TAG" "$RUNNER_TEMP/packages/"*.deb "$RUNNER_TEMP/packages/"*.rpm --clobber --repo "$GITHUB_REPOSITORY"

  # The macOS archive runs on the macOS that OPENPORT_MACOS_FLOOR in CMakeLists.txt
  # names and later. It is built on that macOS, where Homebrew's OpenSSL and zstd, which
  # it links statically, are built for it too; tools/release.sh attaches one only when
  # run on such a Mac. An archive already attached is never replaced: the Homebrew
  # formula pins its checksum.
  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Look for an attached macOS archive
        id: attached
        run: |
          name="openport-${TAG#v}-darwin-arm64"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Listed first, so that grep stopping at a match cannot fail the pipeline.
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if grep -qxF "$name.tar.gz" <<< "$assets"; then
            echo "$name.tar.gz is attached already and stays as it is"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.attached.outputs.build == 'true'
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.attached.outputs.build == 'true'
        with:
          node-version: 26
      - name: Install the build dependencies
        if: steps.attached.outputs.build == 'true'
        run: brew install ninja boost openssl@3 zstd
      - name: Build the web terminal
        if: steps.attached.outputs.build == 'true'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build the engine for the oldest macOS it supports
        if: steps.attached.outputs.build == 'true'
        run: |
          test "$(uname -m)" = arm64
          # Source paths compile in relative to the checkout, as tools/release.sh builds them.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENPORT_BUILD_TESTS=OFF \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=." \
            -DOPENPORT_BUILD_BENCHMARKS=OFF -DOPENPORT_STATIC_DEPS=ON -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build --target openportd openport-probe
          cmake --install build --component openport --prefix "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/openportd" --version
      - name: Check it needs neither Homebrew nor a newer macOS
        if: steps.attached.outputs.build == 'true'
        run: |
          cached() { sed -n "s/^$1:[A-Z]*=//p" build/CMakeCache.txt; }
          floor="$(cached CMAKE_OSX_DEPLOYMENT_TARGET)"
          test -n "$floor"
          echo "macOS $floor and later"
          for file in "$RUNNER_TEMP/prefix/bin/"* "$(cached OPENSSL_SSL_LIBRARY)" "$(cached OPENSSL_CRYPTO_LIBRARY)" "$(cached OPENPORT_ZSTD_LIBRARY)"; do
            newest="$(otool -l "$file" | awk '$1 == "minos" { print $2 }' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
            if [ -z "$newest" ] || [ "$(printf '%s\n%s\n' "$newest" "$floor" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)" != "$floor" ]; then
              echo "::error::$file is built for macOS ${newest:-unknown}, newer than $floor"
              exit 1
            fi
          done
          for binary in "$RUNNER_TEMP/prefix/bin/"*; do
            otool -L "$binary"
            if otool -L "$binary" | tail -n +2 | grep -v -E '^[[:space:]]+/(usr/lib|System/Library)/'; then
              echo "::error::$binary links libraries macOS does not have"
              exit 1
            fi
          done
      - name: Package and attach the archive
        if: steps.attached.outputs.build == 'true'
        run: |
          name="${{ steps.attached.outputs.name }}"
          stage="$RUNNER_TEMP/stage/$name"
          mkdir -p "$stage/docs"
          cp -R "$RUNNER_TEMP/prefix/." "$stage/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.txt "$stage/"
          cp docs/*.md "$stage/docs/"
          tar -C "$RUNNER_TEMP/stage" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
          # Never replacing: an archive attached meanwhile is kept, and this upload fails.
          gh release upload "$TAG" "$RUNNER_TEMP/$name.tar.gz" --repo "$GITHUB_REPOSITORY"

  checksums:
    name: SHA256SUMS
    needs: [linux, macos]
    # Still sum the archives that were attached when a packaging step or the macOS
    # build failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Rewrite SHA256SUMS over archives and packages
        run: |
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/assets" && cd "$RUNNER_TEMP/assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern '*.deb' --pattern '*.rpm'
          sha256sum -- *.tar.gz *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
