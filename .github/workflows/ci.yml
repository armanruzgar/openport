name: CI

# Changes only to the docs or top-level Markdown skip the build. The OpenAPI
# contract stays in: the web, Python and Docker contract tests read it. A change to
# the site runs the web job, whose tests cover the landing page's scripts.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - 'docs/openapi.yaml'
      - '!*.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - 'docs/openapi.yaml'
      - '!*.md'
  workflow_dispatch:

permissions:
  contents: read

# On main, runs are batched: one runs at a time, and a newer push replaces any run
# still waiting, so each run tests the newest commit and covers every push since
# the last one. A run in progress on main finishes; elsewhere a newer push cancels
# it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Each job runs only when something it builds or checks changed since the last
  # commit CI passed on main (on a pull request, since its base; on other branches,
  # since the previous push). A change to this workflow or to the API contract, or
  # no earlier commit to compare (a new branch, a manual run, a force push), runs
  # them all.
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      cpp: ${{ steps.areas.outputs.cpp }}
      web: ${{ steps.areas.outputs.web }}
      python: ${{ steps.areas.outputs.python }}
      docker: ${{ steps.areas.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare with the last commit CI passed
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          since=$BEFORE
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            since=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success \
                      --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
          fi
          echo "comparing with ${since:-nothing}"
          if [ -n "$since" ] && [ "$since" != 0000000000000000000000000000000000000000 ] \
              && git cat-file -e "$since^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$since" "$GITHUB_SHA"; then
            git diff --name-only "$since" "$GITHUB_SHA" > changed.txt
          else
            echo .github/workflows/ci.yml > changed.txt
          fi
          cat changed.txt
          every='^\.github/workflows/ci\.yml$|^docs/openapi\.yaml$'
          area() {
            if grep -qE "$every|$2" changed.txt; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"
          }
          area cpp '^(src|include|apps|tests|cmake|bench|scenarios|data|packaging)/|^CMakeLists\.txt$'
          area web '^(web|site)/'
          # The offline tool tests also check the release files: the formula, packaging,
          # image and third-party notices, the dependencies the notices list, and the
          # oldest macOS the archive supports, which CMakeLists.txt sets.
          area python '^(python|tools|Formula|packaging)/|^(CMakeLists\.txt|Dockerfile|THIRD_PARTY_NOTICES\.txt|web/public/THIRD_PARTY_NOTICES\.txt|web/package-lock\.json|cmake/Dependencies\.cmake|\.github/workflows/release-assets\.yml)$'
          # The Docker job also checks the public demo's proxy (deploy/demo).
          area docker '^(src|include|apps|cmake|scenarios|data|packaging|web|tools|deploy)/|^CMakeLists\.txt$|^Dockerfile$|^\.dockerignore$|^docker-compose\.yml$'
          cat "$GITHUB_OUTPUT"

  # The Release build is cached with ccache, one cache per operating system, so a
  # commit recompiles only what it touched. The plain suite and the suite with
  # incremental reviews and journal changes checked against full rebuilds run
  # side by side on the same cached build instead of one after the other. It
  # also compiles the benchmarks, which a default build includes, without running
  # them, so a change that breaks them fails here and not in a contributor's build.
  cpp:
    name: ${{ matrix.verify && 'C++ (GCC 13, Ubuntu 24.04, reviews and journal checked against rebuilds)' || 'C++ (GCC 13, Ubuntu 24.04, warnings as errors)' }}
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        verify: [false, true]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache libboost-dev libssl-dev zlib1g-dev libzstd-dev
      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-release-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-release-${{ runner.os }}-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DOPENPORT_WERROR=ON
      - name: Build
        id: build
        run: cmake --build build
      - name: Compiler cache statistics
        if: always()
        run: ccache -s
      - name: Save compiler cache
        # Both entries build the same code; only one saves the shared key.
        if: always() && !matrix.verify
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-release-${{ runner.os }}-${{ github.sha }}
      # Each test runs in its own process; tests/CTestCosts.cmake starts the
      # expensive ones first so they do not finish last.
      - name: Test
        if: ${{ !matrix.verify }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: ctest --test-dir build -j 6 --output-on-failure --timeout 1500
      - name: Test incremental reviews and journal changes against full rebuilds
        if: matrix.verify
        env:
          TMPDIR: ${{ runner.temp }}
          OPENPORT_VERIFY_REVIEWS: 1
          OPENPORT_VERIFY_JOURNAL: 1
        run: ctest --test-dir build -j 6 --output-on-failure --timeout 1500
      # The Python tests marked cpp run this build: they check the C++ fixtures'
      # real handler responses against docs/openapi.yaml and drive openportd
      # through the Python client. They run even when CTest failed.
      - uses: actions/setup-python@v7
        if: ${{ !cancelled() && !matrix.verify && steps.build.outcome == 'success' }}
        with:
          python-version: "3.14"
      - name: Python tests of this build
        if: ${{ !cancelled() && !matrix.verify && steps.build.outcome == 'success' }}
        env:
          OPENPORT_REQUIRE_BUILD: 1
        run: |
          pip install './python[pandas,arrow,ws,mcp]' pytest jsonschema pyyaml
          python -m pytest python/tests -m cpp

  cpp-sanitize:
    name: C++ (GCC 13, ASan + UBSan, shard ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    # Cold runs take about 23 minutes; warm runs are expected well under 20.
    timeout-minutes: 35
    strategy:
      # Complete every shard even when another finds a sanitizer failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: 'true' # ccache uses zstd compression.
      CCACHE_MAXSIZE: 1.5G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache libboost-dev libssl-dev zlib1g-dev libzstd-dev
      - name: Restore compiler cache
        # Cache's current major is v6; it uses Node 24 like checkout v7.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sanitize-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-sanitize-${{ runner.os }}-
      - name: Configure
        # -O1 avoids expensive optimization of instrumented code; -g1 keeps
        # function names and line numbers in sanitizer backtraces.
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g1 -DNDEBUG"
          -DOPENPORT_SANITIZE=ON -DOPENPORT_WERROR=ON -DOPENPORT_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build -j 4
      - name: Compiler cache statistics
        if: always()
        run: ccache -s
      - name: Save compiler cache
        # Every shard builds the same code; only one saves the shared key.
        if: always() && matrix.shard == 1
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sanitize-${{ runner.os }}-${{ github.sha }}
      - name: Test
        env:
          TMPDIR: ${{ runner.temp }}
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # Interleave the complete discovered suite across runners. Sanitizer
        # fixtures scale repeated work; no test is excluded. tests/CTestCosts.cmake
        # starts expensive tests first within each shard without changing its IDs.
        run: >
          ctest --test-dir build -j 4 --output-on-failure --timeout 1500
          --no-tests=error -I ${{ matrix.shard }},,${{ strategy.job-total }}

  cpp-macos:
    name: C++ (Apple Clang, macOS 15, warnings as errors)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install ninja ccache boost openssl@3 zstd
      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-release-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-release-${{ runner.os }}-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DOPENPORT_WERROR=ON -DOPENPORT_BUILD_BENCHMARKS=OFF -DOPENPORT_STATIC_DEPS=ON
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Build
        id: build
        run: cmake --build build
      - name: Compiler cache statistics
        if: always()
        run: ccache -s
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-release-${{ runner.os }}-${{ github.sha }}
      # Each test in its own process, in parallel, as on Linux: a crash in one test
      # no longer ends the rest of the suite.
      - name: Test
        run: ctest --test-dir build -j 4 --output-on-failure --timeout 1500
      # ctest names a crashed test but prints no stack: run each failed test again
      # under lldb, which prints every thread's backtrace where it stops.
      - name: Stacks of failed tests
        if: failure()
        timeout-minutes: 15
        run: |
          failed=build/Testing/Temporary/LastTestsFailed.log
          [ -f "$failed" ] || exit 0
          sw_vers; c++ --version
          cut -d: -f2- "$failed" | head -n 5 | while read -r test; do
            echo "::group::$test"
            lldb --batch -o run -k "thread backtrace all" -k "quit 1" \
              -- ./build/tests/openport_tests --gtest_filter="$test" < /dev/null || true
            echo "::endgroup::"
          done
      # The release archive is built this way; it must run on a Mac without Homebrew,
      # and on the oldest macOS it supports (OPENPORT_MACOS_FLOOR in CMakeLists.txt),
      # which the programs and the OpenSSL and zstd they link statically are built for.
      - name: Links only macOS's own libraries, built for the oldest macOS supported
        # About the build alone, so it runs whatever the tests found.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cached() { sed -n "s/^$1:[A-Z]*=//p" build/CMakeCache.txt; }
          floor="$(cached CMAKE_OSX_DEPLOYMENT_TARGET)"
          expected="$(awk '/^set\(OPENPORT_MACOS_FLOOR [0-9.]+\)$/ { sub(/\)$/, "", $2); print $2 }' CMakeLists.txt)"
          if [ -z "$floor" ] || [ "$floor" != "$expected" ]; then
            echo "::error::the deployment target is '$floor', not OPENPORT_MACOS_FLOOR $expected"
            exit 1
          fi
          for file in build/apps/openportd build/apps/openport-probe \
              "$(cached OPENSSL_SSL_LIBRARY)" "$(cached OPENSSL_CRYPTO_LIBRARY)" "$(cached OPENPORT_ZSTD_LIBRARY)"; do
            newest="$(otool -l "$file" | awk '$1 == "minos" { print $2 }' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
            echo "$file: macOS $newest"
            if [ -z "$newest" ] || [ "$(printf '%s\n%s\n' "$newest" "$floor" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)" != "$floor" ]; then
              echo "::error::$file is built for macOS ${newest:-unknown}, newer than $floor"
              exit 1
            fi
          done
          for binary in build/apps/openportd build/apps/openport-probe; do
            otool -L "$binary"
            if otool -L "$binary" | tail -n +2 | grep -v -E '^[[:space:]]+/(usr/lib|System/Library)/'; then
              echo "::error::$binary links libraries macOS does not have"
              exit 1
            fi
          done

  # OPENPORT_BUILD_PROVIDERS=OFF builds the pricing, analytics and trading libraries
  # and their tests without the provider adapters, the server or the apps. Only this
  # job builds it, so it checks that the option still configures, compiles and links;
  # the suites above already run those tests.
  cpp-core:
    name: C++ (GCC 13, without providers and server, builds only)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 500M
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        # The trading library hashes its journal with OpenSSL's libcrypto.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build ccache libssl-dev
      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-core-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-core-${{ runner.os }}-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DOPENPORT_WERROR=ON -DOPENPORT_BUILD_PROVIDERS=OFF -DOPENPORT_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build
      - name: Compiler cache statistics
        if: always()
        run: ccache -s
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-core-${{ runner.os }}-${{ github.sha }}

  web:
    name: Web (TypeScript, Vitest, Vite)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.json
      - run: npx vitest run
      - run: npx vite build

  # The Python tests marked cpp need openportd and the C++ test executable. When
  # C++ changed, the Ubuntu C++ job runs them on its own build. Otherwise this
  # job builds the two from that job's compiler cache, which already holds this
  # code, once the other tests have run, so their results show even when the
  # build fails.
  python:
    name: Python client and MCP
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    # A cold compiler cache means a full build.
    timeout-minutes: 30
    env:
      BUILD_CPP: ${{ needs.changes.outputs.cpp != 'true' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install './python[pandas,arrow,ws,mcp]' pytest jsonschema pyyaml
      - name: Tests not marked cpp
        run: python -m pytest python/tests -m "not cpp"
      - name: Formula updater (offline fixtures)
        run: python tools/update_formula_test.py
      - name: Demo soak tool (scripted replay)
        run: python tools/demo_soak_test.py
      - name: Order fuzz tool (scripted replay)
        run: python tools/order_fuzz_test.py
      - name: Container entrypoint (no Docker)
        run: python tools/docker_entrypoint_test.py
      - name: Third-party notices in every release artifact (offline)
        run: python tools/notices_test.py
      - name: Oldest macOS the release archive supports (offline)
        run: python tools/macos_floor_test.py
      - name: Homebrew service command (no Homebrew)
        run: python tools/formula_service_test.py
      - name: Install system dependencies
        if: ${{ !cancelled() && env.BUILD_CPP == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache libboost-dev libssl-dev zlib1g-dev libzstd-dev
      - name: Restore compiler cache
        if: ${{ !cancelled() && env.BUILD_CPP == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-release-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-release-${{ runner.os }}-
      - name: Build openportd and the C++ tests
        id: build
        if: ${{ !cancelled() && env.BUILD_CPP == 'true' }}
        # The C++ job's configuration, so that its cache hits.
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPENPORT_WERROR=ON
          cmake --build build --target openportd openport_tests
          ccache -s
      - name: Tests marked cpp
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          OPENPORT_REQUIRE_BUILD: 1
        run: python -m pytest python/tests -m cpp

  docker:
    name: Docker image
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t openport:ci .
      - name: Smoke test
        run: |
          docker run -d --rm --name openport -p 127.0.0.1:8080:8080 openport:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/status > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/status > /dev/null
          test "$(curl -s --path-as-is -o /dev/null -w '%{http_code}' http://127.0.0.1:8080//etc/passwd)" = 400
          # Writes need the token the image keeps in its volume; with it, an order fills.
          python3 tools/smoke_trade.py http://127.0.0.1:8080 "$(docker exec openport cat /var/lib/openport/write-token)"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: API contract
        run: |
          pip install jsonschema pyyaml
          python tools/contract_test.py http://127.0.0.1:8080 --token "$(docker exec openport cat /var/lib/openport/write-token)" --spec docs/openapi.yaml
      - name: Stop smoke server
        if: always()
        run: docker stop openport
      # The demo's Caddyfile in front of stub auth and backend containers: anonymous
      # requests refused, a Bearer header alone refused, X-Real-IP overwritten, and a
      # stalled auth gateway failing closed. It needs no image of ours.
      - name: Demo proxy
        if: ${{ !cancelled() }}
        run: python3 tools/demo_proxy_test.py -v
      # A release also packages the image's programs as .deb and .rpm with a systemd
      # unit (release-assets.yml). Built and checked here too, with openportd started
      # from the unit's own command line, a break in packaging/ or a flag the unit
      # passes shows before a release goes out without packages or with a unit that
      # exits on start.
      - name: Packages and their systemd unit
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/bin" "$stage/share/openport" "$stage/docs"
          container="$(docker create openport:ci)"
          docker cp "$container:/usr/local/bin/openportd" "$stage/bin/"
          docker cp "$container:/usr/local/bin/openport-probe" "$stage/bin/"
          docker cp "$container:/usr/share/openport/web" "$stage/share/openport/"
          docker rm "$container"
          cp README.md LICENSE THIRD_PARTY_NOTICES.txt "$stage/"
          cp docs/*.md "$stage/docs/"
          version="$("$stage/bin/openportd" --version)"
          cmake -S packaging -B "$RUNNER_TEMP/packages" -DOPENPORT_STAGE="$stage" \
            -DOPENPORT_PACKAGE_VERSION="${version#openportd }" -DOPENPORT_PACKAGE_ARCH=amd64
          cpack --config "$RUNNER_TEMP/packages/CPackConfig.cmake" -B "$RUNNER_TEMP/packages"
          python3 tools/package_test.py "$RUNNER_TEMP/packages" --arch amd64
